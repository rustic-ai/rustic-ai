name: Validate PR

# Controls when the action will run.
on:
  # Triggers the workflow on pull request events only for the main branch
  pull_request:
    branches: [main]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "test"
  test:
    if: github.repository_owner == 'rustic-ai'

    # The type of runner that the job will run on
    strategy:
      matrix:
        python-versions: [3.13.12]
        os: [ubuntu-24.04]
        redis-versions: [7]
    runs-on: ${{ matrix.os }}

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-versions }}
          cache: "pip"

      - name: Start Redis
        uses: shogo82148/actions-setup-redis@v1
        with:
          redis-version: "latest"
      - run: redis-cli ping

      - name: Start NATS Server (with JetStream)
        run: |
          docker run -d --name nats -p 4222:4222 nats:latest -js
          timeout 30 bash -c 'until nc -z localhost 4222; do sleep 0.5; done'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Keep tox and its GitHub Actions plugin on the verified compatible releases.
          pip install poetry==2.5.2 tox==4.67.16 tox-gh-actions==3.5.1 tox-uv isort black mypy flake8
          pip install poetry-plugin-mono-repo-deps==0.3.3

      - name: Install Playwright Browser
        run: |
          PLAYWRIGHT_VERSION="$(python -c 'import tomllib; lock = tomllib.load(open("poetry.lock", "rb")); print(next(package["version"] for package in lock["package"] if package["name"] == "playwright"))')"
          python -m pip install "playwright==$PLAYWRIGHT_VERSION"
          playwright install --with-deps chromium

      - name: Restore Cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/huggingface
          key: huggingface-rustic-ai-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            huggingface-rustic-ai-

      - name: test with tox
        env:
          PYTEST_ADDOPTS: "--color=yes"
          SKIP_EXPENSIVE_TESTS: true
          RUN_NATS_TESTS: "true"
        run: |
          tox -e test

      - name: Save Cache
        if: matrix.os == 'ubuntu-24.04' && matrix.python-versions == '3.13.12'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/huggingface
          key: huggingface-rustic-ai-${{ hashFiles('poetry.lock') }}
