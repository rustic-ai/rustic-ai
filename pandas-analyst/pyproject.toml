[build-system]
requires = ["poetry-core>=2.5.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "rusticai-pandas-analyst"
version = "0.2.5"
description = "Pandas and DuckDB powered implementation of data analyst dependency."
authors = [{name = "Dragonscale Industries Inc.", email = "dev@dragonscale.ai"}]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.13,<3.14"
urls = { Homepage = "https://www.rustic.ai/", Repository = "https://github.com/dragonscale-ai/rustic-ai", "Rustic AI Core" = "https://pypi.org/project/rusticai-core/" }
dependencies = [
    "rusticai-core>=1.4.2,<1.5.0",
    "rusticai-llm-agent>=1.4.4,<1.5.0",
    "rusticai-uniko-agent>=0.0.6,<0.1.0",
    "duckdb>=2.0.1,<3.0.0",
    "pandas>=3.1.1,<4.0.0",
    "pyarrow>=26.0.1,<27.0.0",
]


[tool.poetry]
packages = [{ include = "rustic_ai", from = "src" }]

[tool.poetry.dependencies]
rusticai-core = { path = "../core", develop = true }
rusticai-llm-agent = { path = "../llm-agent", develop = true }
rusticai-uniko-agent = { path = "../uniko-agent", develop = true }
duckdb = "^2.0.1"
pandas = "^3.1.1"
pyarrow = "^26.0.1"

[tool.poetry.dependencies.pytest]
version = "^9.2.0"
optional = true
[tool.poetry-monorepo.deps]


[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
pytest = "^9.2.0"
black = { version = "^26.10.1", extras = ["jupyter"] }
flake8 = "^7.5.0"
tox = "^4.67.16"
isort = "^9.0.2"
mypy = "^2.4.1"
flaky = "^3.8.1"
pytest-asyncio = "^1.5.0"
rusticai-testing = {path = "../testing", develop = true}

[tool.poetry.extras]
test = ["pytest"]

[tool.black]
line-length = 120
target-version = ['py313']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
check_untyped_defs = true
plugins = "pydantic.mypy"
explicit_package_bases = true


[tool.isort]
profile = "black"
force_sort_within_sections = true # For the sorting order issues
lines_between_sections = 1 # For the newline issue
known_third_party = ["pydantic", "fastapi", "starlette", "uvicorn", "ray", "dotenv", "openai", "litellm", "pytest", "playwright", "redis", "serpapi", "vertexai"]
known_first_party = ["rustic_ai"]
known_local_folder = ["core", "rustic_ai.testing"]
