[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[project]
name = "rusticai-huggingface"
version = "1.3.0"
description = "Rustic AI module with huggingface integrations"
authors = [{name = "Dragonscale Industries Inc.", email = "dev@dragonscale.ai"}]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dynamic = ["dependencies"]
urls = { Homepage = "https://www.rustic.ai/", Repository = "https://github.com/rustic-ai/rustic-ai", "Rustic AI Core" = "https://pypi.org/project/rusticai-core/" }


[tool.poetry]
packages = [{ include = "rustic_ai", from = "src" }]

[tool.poetry.dependencies]
rusticai-core = { path = "../core", develop = true }
torch = [
    { version = "^2.4.0", platform = "darwin" },
    { version = "^2.4.0", source = "pytorch-cpu", platform = "linux" },
]
transformers = { version = "^5.14.1" }
datasets = { version = "^5.0.0" }
soundfile = { version = "^0.14.0" }
sentencepiece = { version = "^0.2.2" }
diffusers = { version = "^0.39.0" }
protobuf = { version = ">=5.0,<8.0" }
pillow = { version = "^12.3.0" }
sentence-transformers = "^5.6.0"

[tool.poetry-monorepo.deps]


[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
black = { version = "^26.5.1", extras = ["jupyter"] }
flake8 = "^7.3.0"
tox = "^4.57.1"
isort = "^8.0.1"
mypy = "^2.3.0"

[tool.poetry.extras]
test = ["pytest"]

[tool.black]
line-length = 120
target-version = ['py313']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
check_untyped_defs = true
plugins = "pydantic.mypy"
explicit_package_bases = true


[tool.isort]
profile = "black"
force_sort_within_sections = true # For the sorting order issues
lines_between_sections = 1 # For the newline issue
known_third_party = ["pydantic", "fastapi", "starlette", "uvicorn", "ray", "dotenv", "openai", "litellm", "pytest", "playwright", "redis", "serpapi", "vertexai"]
known_first_party = ["rustic_ai"]
known_local_folder = ["core", "rustic_ai.testing"]

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"