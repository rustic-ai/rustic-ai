[build-system]
requires = ["poetry-core>=2.5.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[project]
name = "rusticai-core"
version = "1.4.2"
description = "Rustic AI’s modular, agentic AI framework for building human-centered, multi-agent workflows"
authors = [{name = "Dragonscale Industries Inc.", email = "dev@dragonscale.ai"}]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dynamic = ["dependencies"]
urls = { Homepage = "https://www.rustic.ai/", Repository = "https://github.com/rustic-ai/rustic-ai" }



[tool.poetry]
packages = [{ include = "rustic_ai", from = "src" }]

[tool.poetry.dependencies]
pydantic = "^2.14.4"
shortuuid = "^1.0.13"
types-python-dateutil = "^2.9.0.20261122"
pyyaml = "^6.0.4"
jsonata-python = "^0.7.2"
fsspec = "^2026.9.0"
jsonpath-ng = "^1.16.0"
json-merge-patch = "^0.3.0"
sqlmodel = "^0.0.50"
types-pyyaml = "^6.0.12.20261122"
aiohttp = "^3.14.5"
jsonpatch = "^1.48"
sympy = "^1.14.0"
# botocore (used by LiteLLM) requires python-dateutil <3.0.0.
python-dateutil = "^2.9.0.post0"
opentelemetry-api = "^1.45.2"
chevron = "^0.14.0"
cel-python = "^0.5.0"
apscheduler = "^3.11.3"
diskcache = "^5.6.3"

[tool.poetry.dependencies.pytest]
version = "^9.2.0"
optional = true

[tool.poetry.dependencies.flaky]
version = "^3.8.1"
optional = true

[tool.poetry.dependencies.pytest-asyncio]
version = "^1.5.0"
optional = true
[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
pytest = "^9.2.0"
black = { version = "^26.10.1", extras = ["jupyter"] }
flake8 = "^7.5.0"
tox = "^4.67.16"
isort = "^9.0.2"
mypy = "^2.4.1"
flaky = "^3.8.1"
pytest-asyncio = "^1.5.0"


[tool.poetry.extras]
test = ["pytest", "flaky", "pytest-asyncio"]

[tool.black]
line-length = 120
target-version = ['py313']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | resources/*
)/
'''

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
check_untyped_defs = true
plugins = "pydantic.mypy"
explicit_package_bases = true

[tool.isort]
profile = "black"
force_sort_within_sections = true # For the sorting order issues
lines_between_sections = 1 # For the newline issue
known_third_party = ["pydantic", "fastapi", "starlette", "uvicorn", "ray", "dotenv", "openai", "litellm", "pytest", "playwright", "redis", "serpapi", "vertexai"]
known_first_party = ["rustic_ai"]
known_local_folder = ["core", "rustic_ai.testing"]
