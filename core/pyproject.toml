[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[project]
name = "rusticai-core"
version = "1.3.0"
description = "Rustic AI’s modular, agentic AI framework for building human-centered, multi-agent workflows"
authors = [{name = "Dragonscale Industries Inc.", email = "dev@dragonscale.ai"}]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dynamic = ["dependencies"]
urls = { Homepage = "https://www.rustic.ai/", Repository = "https://github.com/rustic-ai/rustic-ai" }



[tool.poetry]
packages = [{ include = "rustic_ai", from = "src" }]

[tool.poetry.dependencies]
pydantic = "^2.13.4"
shortuuid = "^1.0.13"
types-python-dateutil = "^2.9.0.20260716"
pyyaml = "^6.0.3"
jsonata-python = "^0.7.0"
fsspec = "^2026.4.0"
jsonpath-ng = "^1.8.0"
json-merge-patch = "^0.3.0"
sqlmodel = "^0.0.39"
types-pyyaml = "^6.0.12.20260518"
aiohttp = "^3.14.2"
jsonpatch = "^1.33"
sympy = "^1.14.0"
python-dateutil = "^2.9.0.post0"
opentelemetry-api = "^1.44.0"
chevron = "^0.14.0"
cel-python = "^0.5.0"
apscheduler = "^3.11.3"
diskcache = "^5.6.3"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
black = { version = "^26.5.1", extras = ["jupyter"] }
flake8 = "^7.3.0"
tox = "^4.57.1"
isort = "^8.0.1"
mypy = "^2.3.0"
flaky = "^3.8.1"
pytest-asyncio = "^1.4.0"


[tool.poetry.extras]
test = ["pytest", "flaky", "pytest-asyncio"]

[tool.black]
line-length = 120
target-version = ['py313']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | resources/*
)/
'''

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
check_untyped_defs = true
plugins = "pydantic.mypy"
explicit_package_bases = true

[tool.isort]
profile = "black"
force_sort_within_sections = true # For the sorting order issues
lines_between_sections = 1 # For the newline issue
known_third_party = ["pydantic", "fastapi", "starlette", "uvicorn", "ray", "dotenv", "openai", "litellm", "pytest", "playwright", "redis", "serpapi", "vertexai"]
known_first_party = ["rustic_ai"]
known_local_folder = ["core", "rustic_ai.testing"]
