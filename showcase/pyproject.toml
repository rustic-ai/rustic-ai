[build-system]
requires = ["poetry-core>=2.5.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[project]
name = "rusticai-showcase"
version = "1.4.0"
description = "Module that showcases Rustic AI capabilities"
authors = [{name = "Dragonscale Industries Inc.", email = "dev@dragonscale.ai"}]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dynamic = ["dependencies"]
urls = { Homepage = "https://www.rustic.ai/", Repository = "https://github.com/rustic-ai/rustic-ai", "Rustic AI Core" = "https://pypi.org/project/rusticai-core/" }


[tool.poetry]
packages = [
    { include = "rustic_ai", from = "src" },
    { include = "apps", to = "rustic_ai/showcase" },
]

[tool.poetry.dependencies]
rusticai-unidb = {path = "../unidb", develop = true, extras = ["tools"]}
rusticai-core = { path = "../core", develop = true }
rusticai-chroma = { path = "../chroma", develop = true }
rusticai-langchain = { path = "../langchain", develop = true }
rusticai-litellm = { path = "../litellm", develop = true }
rusticai-playwright = { path = "../playwright", develop = true }
rusticai-serpapi = { path = "../serpapi", develop = true }
rusticai-vertexai = { path = "../vertexai", develop = true }
rusticai-llm-agent = { path = "../llm-agent", develop = true }
rusticai-pandas-analyst = { path = "../pandas-analyst", develop = true }
rusticai-uniko-agent = {path = "../uniko-agent", develop = true}
rusticai-research-manager = {path = "../research-manager", develop = true}
rusticai-fact-checker = {path = "../fact-checker", develop = true}
rusticai-mcp = {path = "../mcp", develop = true}
arxiv = "^4.1.0"
aiohttp = "^3.14.5"

[tool.poetry.dependencies.pytest]
version = "^9.2.0"
optional = true
[tool.poetry-monorepo.deps]


[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
pytest = "^9.2.0"
black = { version = "^26.10.1", extras = ["jupyter"] }
flake8 = "^7.5.0"
tox = "^4.67.16"
isort = "^9.0.2"
mypy = "^2.4.1"
pytest-asyncio = "^1.5.0"

[[tool.poetry.source]]
name = "uniko"
url = "https://rustic-ai.github.io/uniko/packages/"
priority = "explicit"

[tool.poetry.extras]
test = ["pytest"]

[tool.black]
line-length = 120
target-version = ['py313']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
check_untyped_defs = true
plugins = "pydantic.mypy"
explicit_package_bases = true


[tool.isort]
profile = "black"
force_sort_within_sections = true # For the sorting order issues
lines_between_sections = 1 # For the newline issue
known_third_party = ["pydantic", "fastapi", "starlette", "uvicorn", "ray", "dotenv", "openai", "litellm", "pytest", "playwright", "redis", "serpapi", "vertexai"]
known_first_party = ["rustic_ai"]
known_local_folder = ["core", "rustic_ai.testing"]
