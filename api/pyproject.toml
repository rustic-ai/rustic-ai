[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[project]
name = "rusticai-api"
version = "1.4.0"
description = "API Server for Rustic AI"
authors = [{name = "Dragonscale Industries Inc.", email = "dev@dragonscale.ai"}]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dynamic = ["dependencies"]
urls = { Homepage = "https://www.rustic.ai/", Repository = "https://github.com/rustic-ai/rustic-ai", "Rustic AI Core" = "https://pypi.org/project/rusticai-core/" }


[tool.poetry]
packages = [{ include = "rustic_ai", from = "src" }]

[tool.poetry.dependencies]
rusticai-core = { path = "../core", develop = true }
rusticai-ray = { path = "../ray", develop = true }
fastapi = "^0.139.2"
starlette = "^1.3.1"
uvicorn = "^0.51.0"
ptvsd = "^4.3.2"
python-multipart = "^0.0.32"
opentelemetry-distro = "^0.65b0"
websockets = "^16.1.1"
griffe = "^2.1.0"
psycopg = "^3.3.4"
python-json-logger = "^4.1.0"

[tool.poetry-monorepo.deps]


[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
black = { version = "^26.5.1", extras = ["jupyter"] }
flake8 = "^7.3.0"
tox = "^4.57.1"
isort = "^8.0.1"
mypy = "^2.3.0"
pytest-asyncio = "^1.4.0"
httpx = "^0.28.1"
rusticai-testing = { path = "../testing", develop = true }

[tool.poetry.extras]
test = ["pytest", "pytest-asyncio", "httpx", "rusticai-testing"]

[tool.black]
line-length = 120
target-version = ['py313']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
check_untyped_defs = true
plugins = "pydantic.mypy"
explicit_package_bases = true


[tool.isort]
profile = "black"
force_sort_within_sections = true # For the sorting order issues
lines_between_sections = 1 # For the newline issue
known_third_party = ["pydantic", "fastapi", "starlette", "uvicorn", "ray", "dotenv", "openai", "litellm", "pytest", "playwright", "redis", "serpapi", "vertexai"]
known_first_party = ["rustic_ai"]
known_local_folder = ["core", "rustic_ai.testing"]
